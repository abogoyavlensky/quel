name: ci

on:
  push:
    branches: [master]
  pull_request:
  # release.yml runs these checks on the tagged commit.
  workflow_call:

# Called from release.yml, github.workflow is "release": a release's checks
# get their own group and are never cancelled by, or cancel, ordinary runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'ci' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The runner has no GTK4/WebKitGTK, so the app runs in Wails' cgo-free
      # server mode: an HTTP server instead of a window. Both vars are needed
      # - a few Wails packages gate on `linux && cgo` without a `!server`
      # guard.
      CGO_ENABLED: "0"
      GOFLAGS: -tags=server
    steps:
      - uses: actions/checkout@v4

      # lg, lgx, go and node, at the versions in .mise.toml.
      - uses: jdx/mise-action@v3

      # The custom lg runtime (Wails, sqlite) is cached by its inputs, so a
      # run with an unchanged lgx.edn reuses it.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.lgx/runtimes
            ~/.npm
          key: deps-${{ runner.os }}-${{ runner.arch }}-server-${{ hashFiles('.mise.toml', 'lgx.edn', 'frontend/package-lock.json') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-server-

      # The signing, publishing and tap scripts, with stand-ins for Apple's
      # tools and GitHub.
      - name: Release script tests
        run: lgx test-release

      - name: Frontend tests
        run: |
          lgx fe-install
          npm --prefix frontend test

      - name: Frontend build
        run: lgx fe-build

      # With a throwaway Postgres in Docker (the runner has Docker), so the
      # Postgres tests run too.
      - name: Backend tests
        run: lgx test-pg

      # The nREPL step is skipped: its client lives in a letgo-packages
      # checkout, which CI does not have.
      - name: Smoke test
        run: lgx smoke-pg

      - name: Playwright browser
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: UI tests
        run: lgx e2e

      - name: UI test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore

  macos:
    # The real desktop build, packaged as Quel.app, ad-hoc signed and
    # launched. No secrets: Developer ID signing happens only in release.yml.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/package-macos

      - name: Verify
        run: lgx verify-macos
